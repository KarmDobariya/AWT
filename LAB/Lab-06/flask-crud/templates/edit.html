<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container form-box">
    <h2>Edit Expense</h2>

    <form method="post">
        <input type="text" name="title" value="{{ expense.title }}" required>
        <input type="number" step="0.01" name="amount" value="{{ expense.amount }}" required>

        <select name="category">
            <option {% if expense.category=='Food' %}selected{% endif %}>Food</option>
            <option {% if expense.category=='Travel' %}selected{% endif %}>Travel</option>
            <option {% if expense.category=='Shopping' %}selected{% endif %}>Shopping</option>
            <option {% if expense.category=='Other' %}selected{% endif %}>Other</option>
        </select>

        <button type="submit">Update</button>
    </form>

    <br>
    <a href="/">Back</a>
</div>
</body>
</html>
